<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlipComposer Legal</title>
<style>
  :root {
    --ground: #faf9f6;
    --surface: #ffffff;
    --ink: #1b1b1a;
    --muted: #6a6a64;
    --rule: #e7e5df;
    --accent: #4f7a00;
    --maxw: 44rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #101010;
      --surface: #161614;
      --ink: #e8e7e2;
      --muted: #9b9a93;
      --rule: #2a2a26;
      --accent: #ccff00;
    }
  }
  :root[data-theme="dark"] {
    --ground: #101010;
    --surface: #161614;
    --ink: #e8e7e2;
    --muted: #9b9a93;
    --rule: #2a2a26;
    --accent: #ccff00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: var(--maxw); margin: 0 auto; padding: 4rem 1.25rem 6rem; }
  h1 { font-size: 1.9rem; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
  .lede { color: var(--muted); margin: 0 0 2.5rem; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.75rem; }
  a.doc {
    display: block;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 1rem 1.15rem;
    text-decoration: none;
    color: var(--ink);
    font-weight: 600;
  }
  a.doc:hover { border-color: var(--accent); }
  a.doc span { display: block; font-weight: 400; font-size: 0.9rem; color: var(--muted); margin-top: 0.15rem; }
  footer {
    margin-top: 3rem; padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    color: var(--muted); font-size: 0.85rem;
  }
</style>
</head>
<body>
<main>
  <h1>SlipComposer</h1>
  <p class="lede">Legal documents for the SlipComposer app.</p>
  <ul>
    <li>
      <a class="doc" href="privacy.html">Privacy Policy
        <span>What the app collects, how it is used, and your choices.</span>
      </a>
    </li>
  </ul>
  <footer>
    Entertainment and information only. SlipComposer is not a betting operator,
    does not accept wagers, and holds no funds. Contact:
    ceo.sharppicklab@gmail.com
  </footer>
</main>
</body>
</html>
